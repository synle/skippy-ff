name: build-main

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Standalone unit-test job. Mirrors `npm test` (Vitest) and `npm run lint`
    # decoupled from the coverage threshold gate so a regression shows up as a
    # plain "test" failure without being conflated with "coverage dropped".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - run: npm ci || npm install --no-fund --prefer-offline

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  build:
    # https://github.com/synle/workflows/blob/main/.github/workflows/build-and-commit-sh.yml
    # `deploy-to-pages: false` — Skippy is a Chrome extension; there is no website to host
    # on GitHub Pages. Leaving this on caused the `deploy-pages@v4` step to fail with
    # `HttpError: Not Found` because Pages was never enabled on this repo.
    uses: synle/workflows/.github/workflows/build-and-commit-sh.yml@main
    with:
      deploy-to-pages: false
    permissions:
      contents: write

  coverage:
    # Coverage thresholds live in vite.config.js under
    # `test.coverage.thresholds`. The `--coverage` flag fails the
    # run when any of statements / branches / functions / lines
    # falls below its configured floor. `tee` keeps the full
    # output for the step-summary block below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - run: npm ci || npm install --no-fund --prefer-offline

      - name: Run coverage
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee /tmp/cov.txt

      # Upload the full HTML / json-summary reports as an artifact
      # so reviewers can drill into per-file line-level coverage
      # when the run-page summary's totals aren't enough. `always()`
      # so the artifact still uploads when thresholds fail — that's
      # exactly when humans want the numbers.
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: coverage/
          retention-days: 30
          if-no-files-found: ignore

      # Surface the coverage summary on the run page. `always()` so
      # it posts even when thresholds fail.
      - name: Post coverage to step summary
        if: always()
        run: |
          {
            echo "## Test coverage — \`$GITHUB_SHA\`"
            echo
            echo '```text'
            if [ -f /tmp/cov.txt ]; then
              awk '/^=+ Coverage summary =+$/,/^=+$/' /tmp/cov.txt \
                || tail -n 8 /tmp/cov.txt
            else
              echo "(coverage did not run)"
            fi
            echo '```'
            echo
            echo "Thresholds (from \`vite.config.js → test.coverage.thresholds\`):"
            echo "lines ≥ 50, statements ≥ 50, branches ≥ 50, functions ≥ 50."
          } >> "$GITHUB_STEP_SUMMARY"

  pr-artifacts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - run: npm ci || npm install --no-fund --prefer-offline

      - run: npm run build

      - run: node scripts/bundle.js

      - name: Upload extension zip
        uses: actions/upload-artifact@v7
        id: upload
        with:
          name: skippy-ff-pr-${{ github.event.pull_request.number }}
          path: skippy-ff.zip
          retention-days: 30
          compression-level: 0

      - name: Post PR comment with artifact link
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const stats = fs.statSync('skippy-ff.zip');
            const sizeMB = (stats.size / 1024 / 1024).toFixed(2);
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf-8'));
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              `### 📦 Build Artifact`,
              ``,
              `| Artifact | Version | Size |`,
              `|----------|---------|------|`,
              `| [skippy-ff.zip](${runUrl}#artifacts) | ${pkg.version} | ${sizeMB} MB |`,
              ``,
              `Download from the [Actions run artifacts](${runUrl}#artifacts).`,
            ].join('\n');

            // Find and update existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('### 📦 Build Artifact'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
